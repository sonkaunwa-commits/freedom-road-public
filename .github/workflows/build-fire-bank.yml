name: build-fire-securities-bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_exam_fire_bank.py'
      - '.github/workflows/build-fire-bank.yml'

permissions:
  contents: write

concurrency:
  group: build-fire-securities-bank
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build filtered FIRE securities bank
        run: python3 scripts/build_exam_fire_bank.py
      - name: Validate generated bank
        shell: bash
        run: |
          set -euo pipefail
          test -s site/quiz-v4/fire-securities-v491.js
          grep -Fq 'window.SEC_FIRE_V491=' site/quiz-v4/fire-securities-v491.js
          grep -Fq 'Apache-2.0' site/quiz-v4/fire-securities-v491.js
          python3 - <<'PY'
          import re,json
          p='site/quiz-v4/fire-securities-v491.js'
          s=open(p,encoding='utf-8').read()
          m=re.search(r'window.SEC_FIRE_META_V491=(\{.*?\});',s)
          assert m, 'missing meta'
          x=json.loads(m.group(1))
          assert x['count'] >= 500, x
          assert x['finance'] >= 200, x
          assert x['law'] >= 150, x
          print('FIRE bank PASS',x)
          PY
      - name: Commit generated bank
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/quiz-v4/fire-securities-v491.js
          if git diff --cached --quiet; then
            echo 'Generated bank unchanged.'
            exit 0
          fi
          git commit -m 'data: refresh FIRE securities question bank v4.9.1'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            [[ "$attempt" == 5 ]] && exit 1
            sleep 2
          done
