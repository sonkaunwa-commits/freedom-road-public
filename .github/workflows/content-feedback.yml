name: content-feedback

on:
  pull_request:
    paths:
      - 'content_feedback/**'
      - 'scripts/validate_content_feedback.py'
      - '.github/workflows/content-feedback.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_content_feedback.py
