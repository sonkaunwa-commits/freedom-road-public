name: exam-retirement-guard
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prevent retired exam product resurrection
        shell: bash
        run: |
          set -euo pipefail
          forbidden_paths=(
            site/exam-live
            site/securities-exam
            site/investment-advisor-exam
            site/ks
            site/quiz-v4
            site/tg
            site/exam-desktop-v29.js
            site/exam-desktop-v29-fix.css
            scripts/build_exam_fire_bank.py
            .github/workflows/build-fire-bank.yml
            .github/workflows/securities-browser-smoke.yml
            .github/workflows/securities-freeze-isolate.yml
            .github/workflows/securities-v360-live.yml
            .github/workflows/securities-v4-smoke.yml
            .github/workflows/securities-v451-explanation-smoke.yml
          )
          for p in "${forbidden_paths[@]}"; do
            if [[ -e "$p" ]]; then echo "Retired exam artifact reintroduced: $p" >&2; exit 1; fi
          done
          if [[ -f site/CNAME ]] && grep -Fq 'exam.freovia.com' site/CNAME; then
            echo 'Retired exam.freovia.com custom domain reintroduced.' >&2; exit 1
          fi
          if git ls-files 'scripts/securities-*' | grep -q .; then
            echo 'Retired securities exam script reintroduced.' >&2
            git ls-files 'scripts/securities-*' >&2
            exit 1
          fi
          echo 'Exam retirement guard PASS'
