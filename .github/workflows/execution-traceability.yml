name: execution-traceability

on:
  pull_request:
    paths:
      - 'execution_traceability/**'
      - 'scripts/validate_execution_traceability.py'
      - '.github/workflows/execution-traceability.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_execution_traceability.py
