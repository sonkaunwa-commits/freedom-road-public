name: model-router

on:
  pull_request:
    paths:
      - 'model_router/**'
      - 'scripts/validate_model_router.py'
      - 'scripts/test_model_router.py'
      - '.github/workflows/model-router.yml'
  push:
    branches: [main]
    paths:
      - 'model_router/**'
      - 'scripts/validate_model_router.py'
      - 'scripts/test_model_router.py'
      - '.github/workflows/model-router.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_model_router.py
      - run: python scripts/test_model_router.py
