name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify static publication boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/latest/manifest.json
          test -f site/publication.json
          if find site -type l -print -quit | grep -q .; then
            echo 'Symlinks are not allowed in the public site.' >&2
            exit 1
          fi
          python3 -m json.tool site/latest/manifest.json >/dev/null
          python3 -m json.tool site/publication.json >/dev/null
          test -f site/fund-assistant/index.html
          test -f site/fund-assistant/v9.html
          test -f site/fund-assistant/v9-accessible.html
          test -f site/fund-assistant/v9-buttons.css
          test -f site/fund-assistant/v9-market-r20260822-1706.js
          test -f site/fund-assistant/v9-buttons-r20260822-1706.js
          test -f site/securities-exam/index.html
          test -f site/investment-advisor-exam/index.html
          grep -Fq 'FUND_ASSISTANT_ENTRY_20260822_1706' site/fund-assistant/index.html
          grep -Fq 'FUND_ASSISTANT_UI_20260822_1706' site/fund-assistant/v9-accessible.html
          grep -Fq 'securities-exam' site/ks/index.html
          grep -Fq 'investment-advisor-exam' site/tg/index.html

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify public endpoints
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonkaunwa-commits.github.io/freedom-road-public'
          paths=(
            ''
            'latest/manifest.json'
            'publication.json'
            'fund-assistant/'
            'fund-assistant/v9-accessible.html'
            'fund-assistant/v9-market-r20260822-1706.js'
            'fund-assistant/v9-buttons-r20260822-1706.js'
            'fund-assistant/v9-buttons.css'
            'securities-exam/'
            'investment-advisor-exam/'
            'ks/'
            'tg/'
          )
          for path in "${paths[@]}"; do
            ok=false
            for attempt in {1..18}; do
              if curl -fsSL --max-time 20 --retry 2 "$base/$path?smoke=${GITHUB_SHA}-${attempt}" >/dev/null; then
                ok=true
                break
              fi
              sleep 5
            done
            if [[ "$ok" != true ]]; then
              echo "Endpoint failed: $path" >&2
              exit 1
            fi
          done

          verify_content() {
            local path="$1" pattern="$2" name="$3"
            local body
            body="$(curl -fsSL --max-time 30 --retry 3 "$base/$path?content=${GITHUB_SHA}")"
            if ! grep -Fq "$pattern" <<<"$body"; then
              echo "Content verification failed: $name" >&2
              exit 1
            fi
          }
          verify_content 'fund-assistant/' 'FUND_ASSISTANT_ENTRY_20260822_1706' 'fund assistant entry'
          verify_content 'fund-assistant/v9-accessible.html' 'FUND_ASSISTANT_UI_20260822_1706' 'fund assistant accessible shell'
          verify_content 'fund-assistant/v9-market-r20260822-1706.js' 'immutable release 2026-08-22 17:06 CST' 'fund assistant trading-day guard'
          verify_content 'fund-assistant/v9-buttons-r20260822-1706.js' "UI_VERSION='08/22 17:06'" 'fund assistant button/date layer'
          verify_content 'fund-assistant/v9.html' 'v9-core.js' 'fund assistant app'
          verify_content 'ks/' 'securities-exam' 'securities short entry'
          verify_content 'tg/' 'investment-advisor-exam' 'advisor short entry'
          verify_content 'securities-exam/' '证券从业 2026' 'securities app'
          verify_content 'investment-advisor-exam/' '证券投资顾问 2026' 'advisor app'
