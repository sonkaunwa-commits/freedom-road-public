name: deploy-pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify static publication boundary and current releases
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/latest/manifest.json
          test -f site/publication.json
          test -f site/fund-assistant/index.html
          test -f site/fund-assistant/release.json
          test -f site/fund-assistant/v9.html
          test -f site/fund-assistant/v9-core.js
          test -f site/fund-assistant/v8-ui.js
          test -f site/fund-assistant/v9-patch.js
          test -f site/fund-assistant/v9-buttons.js
          test -f site/fund-assistant/v9.css
          test -f site/fund-assistant/v9-buttons.css
          test -f site/securities-exam/index.html
          test -f site/investment-advisor-exam/index.html
          test -f site/ks/index.html
          python3 -m json.tool site/latest/manifest.json >/dev/null
          python3 -m json.tool site/publication.json >/dev/null
          python3 -m json.tool site/fund-assistant/release.json >/dev/null
          if find site -type l -print -quit | grep -q .; then echo 'Symlinks are not allowed.' >&2; exit 1; fi

          python3 - <<'PY'
          import json,re
          from html.parser import HTMLParser
          from pathlib import Path
          base=Path('site/fund-assistant')
          x=json.loads((base/'release.json').read_text(encoding='utf-8'))
          entry=x['entry']; release=x['release']; version=x['version']; behavior=x.get('behavior')
          ep=base/entry
          assert ep.is_file(), f'missing current entry: {entry}'
          body=ep.read_text(encoding='utf-8')
          assert 'document.write' not in body
          assert 'html=html.replace' not in body
          assert '<script src="v9-buttons.js' in body
          assert '<link rel="stylesheet" href="v9-buttons.css' in body
          if release not in body:
              assert behavior
              bp=base/behavior
              assert bp.is_file() and release in bp.read_text(encoding='utf-8')
          for asset in sorted(set(re.findall(r'[A-Za-z0-9._-]+\.(?:js|css)', body))):
              assert (base/asset).is_file(), f'missing static asset: {asset}'
          class P(HTMLParser): pass
          P().feed(body)
          print(f'Current static fund release: {version} -> {entry} / {behavior}')
          PY

          node --check site/fund-assistant/v9-core.js
          node --check site/fund-assistant/v8-ui.js
          node --check site/fund-assistant/v9-patch.js
          node --check site/fund-assistant/v9-buttons.js
          grep -Fq 'FUND_ASSISTANT_BOOTSTRAP_' site/fund-assistant/index.html
          grep -Fq 'investment-advisor-exam' site/tg/index.html

          if grep -Fq 'v3.4.0' site/ks/index.html; then
            for f in ui-pro-r2.css ui-pro-r2.js assistant-v31.js assistant-v31.css sources-v321.js sources-v321.css release-v32.js release-v32.css ux-fix-v27.js sw.js manifest.webmanifest; do
              test -f "site/securities-exam/$f"
            done
            grep -Fq 'data-product-version="3.4.0"' site/securities-exam/index.html
            grep -Fq 'ui-pro-r2.css?v=340' site/securities-exam/index.html
            grep -Fq 'ui-pro-r2.js?v=340' site/securities-exam/index.html
            ! grep -Fq 'ui-pro-r1.css' site/securities-exam/index.html
            grep -Fq "VERSION='3.4.0'" site/securities-exam/ui-pro-r2.js
            grep -Fq '今天只盯三件事' site/securities-exam/ui-pro-r2.js
            grep -Fq '学习报告' site/securities-exam/ui-pro-r2.js
            grep -Fq 'sec_r2_mastery_v1' site/securities-exam/ui-pro-r2.js
            grep -Fq "version:'3.4.0'" site/securities-exam/release-v32.js
            grep -Fq "version:'3.4.0'" site/securities-exam/release-v24.js
            grep -Fq 'sec2026-v340' site/securities-exam/sw.js
            grep -Fq 'assistant-v31.js?v=340' site/securities-exam/ux-fix-v27.js
            grep -Fq 'sources-v321.js?v=340' site/securities-exam/ux-fix-v27.js
            grep -Fq 'release-v32.js?v=340' site/securities-exam/ux-fix-v27.js
            node --check site/securities-exam/ui-pro-r2.js
            node --check site/securities-exam/assistant-v31.js
            node --check site/securities-exam/sources-v321.js
            node --check site/securities-exam/release-v32.js
            python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('site/securities-exam/sources-v321.js').read_text(encoding='utf-8')
          urls=re.findall(r'https://www\.kdocs\.cn/l/[A-Za-z0-9]+',s)
          assert len(urls)==17 and len(set(urls))==17
          assert len(re.findall(r"id:'law-",s))==7
          assert len(re.findall(r"id:'finance-",s))==10
          print('Securities v3.4 source index PASS')
          PY
            if grep -Fq "status:'structured-import'" site/securities-exam/release-v32.js; then
              test -f site/securities-exam/kdocs-learning-v1.json
              test -f site/securities-exam/learning-pack-v330.js
              test -f site/securities-exam/learning-pack-v330.css
              node --check site/securities-exam/learning-pack-v330.js
              python3 - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('site/securities-exam/kdocs-learning-v1.json').read_text(encoding='utf-8'))
          assert x['source_policy']=='derived-paraphrase-only-no-raw-body'
          assert x['source_count']==17 and x['law_count']==7 and x['finance_count']==10
          assert x['total_key_points']>=65
          assert len(x['documents'])==17 and len({d['source_id'] for d in x['documents']})==17
          print('Securities v3.4 structured KDocs payload PASS')
          PY
            fi
            echo 'Securities v3.4 static release PASS'
          elif grep -Fq 'v3.3.0' site/ks/index.html; then
            test -f site/securities-exam/kdocs-learning-v1.json
            test -f site/securities-exam/learning-pack-v330.js
            test -f site/securities-exam/learning-pack-v330.css
          else
            grep -Fq 'securities-exam' site/ks/index.html
          fi

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify live releases
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonkaunwa-commits.github.io/freedom-road-public'
          get() { curl -fsSL --max-time 30 --retry 3 "$base/$1?verify=${GITHUB_SHA}"; }
          for path in '' 'latest/manifest.json' 'publication.json' 'fund-assistant/' 'fund-assistant/release.json' 'securities-exam/' 'ks/' 'investment-advisor-exam/' 'tg/'; do
            ok=false
            for attempt in {1..24}; do if get "$path" >/dev/null; then ok=true; break; fi; sleep 5; done
            [[ "$ok" == true ]] || { echo "Endpoint failed: $path" >&2; exit 1; }
          done

          local_release='site/fund-assistant/release.json'
          version="$(python3 -c "import json;print(json.load(open('$local_release'))['version'])")"
          release="$(python3 -c "import json;print(json.load(open('$local_release'))['release'])")"
          entry="$(python3 -c "import json;print(json.load(open('$local_release'))['entry'])")"
          behavior="$(python3 -c "import json;print(json.load(open('$local_release')).get('behavior',''))")"
          release_body="$(get 'fund-assistant/release.json')"; grep -Fq "$release" <<<"$release_body"
          entry_body="$(get "fund-assistant/$entry")"; grep -Fq 'v9-buttons.js' <<<"$entry_body"; grep -Fq 'v9-buttons.css' <<<"$entry_body"
          cat > /tmp/fund-release-status.txt <<EOF
          status=ok
          architecture=static-direct
          deployed_sha=${GITHUB_SHA}
          release=${release}
          version=${version}
          url=${base}/fund-assistant/
          entry=${entry}
          behavior=${behavior}
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          if grep -Fq 'v3.4.0' site/ks/index.html; then
            for path in 'securities-exam/ui-pro-r2.css' 'securities-exam/ui-pro-r2.js' 'securities-exam/assistant-v31.js' 'securities-exam/sources-v321.js' 'securities-exam/release-v32.js' 'securities-exam/sw.js'; do
              body="$(get "$path")"
              case "$path" in
                *ui-pro-r2.js) grep -Fq "VERSION='3.4.0'" <<<"$body"; grep -Fq '今天只盯三件事' <<<"$body" ;;
                *assistant-v31.js) grep -Fq 'SEC_ASSISTANT_V31' <<<"$body" ;;
                *sources-v321.js) grep -Fq 'SEC_SOURCES_V321' <<<"$body" ;;
                *release-v32.js) grep -Fq "version:'3.4.0'" <<<"$body" ;;
                *sw.js) grep -Fq 'sec2026-v340' <<<"$body" ;;
              esac
            done
            sec_body="$(get 'securities-exam/')"; grep -Fq 'data-product-version="3.4.0"' <<<"$sec_body"; grep -Fq 'ui-pro-r2.css?v=340' <<<"$sec_body"; grep -Fq 'ui-pro-r2.js?v=340' <<<"$sec_body"
            ks_body="$(get 'ks/')"; grep -Fq 'v3.4.0' <<<"$ks_body"
            source_mode='indexed-links'
            if grep -Fq "status:'structured-import'" <<<"$(get 'securities-exam/release-v32.js')"; then
              get 'securities-exam/kdocs-learning-v1.json' >/dev/null
              get 'securities-exam/learning-pack-v330.js' >/dev/null
              source_mode='derived-paraphrase-only'
            fi
            cat > /tmp/securities-release-status.txt <<EOF
          status=ok
          architecture=learning-workspace-r2
          deployed_sha=${GITHUB_SHA}
          version=3.4.0
          ui=R2
          source_count=17
          source_mode=${source_mode}
          url=${base}/ks/
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          fi

      - name: Record successful live verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          cp /tmp/fund-release-status.txt release-status/fund-assistant.txt
          if [[ -f /tmp/securities-release-status.txt ]]; then cp /tmp/securities-release-status.txt release-status/securities-exam.txt; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status
          if ! git diff --cached --quiet; then
            git commit -m 'status: live release verification passed'
            git push
          fi
