name: deploy-pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, .github/workflows/pages.yml]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify publication
        shell: bash
        run: |
          set -euo pipefail
          for f in site/index.html site/latest/manifest.json site/publication.json site/fund-assistant/index.html site/fund-assistant/release.json site/securities-exam/index.html site/investment-advisor-exam/index.html site/ks/index.html site/tg/index.html; do test -f "$f"; done
          python3 -m json.tool site/latest/manifest.json >/dev/null
          python3 -m json.tool site/publication.json >/dev/null
          python3 -m json.tool site/fund-assistant/release.json >/dev/null
          if find site -type l -print -quit | grep -q .; then echo 'Symlinks are not allowed.' >&2; exit 1; fi
          grep -Fq 'FUND_ASSISTANT_BOOTSTRAP_' site/fund-assistant/index.html
          grep -Fq 'investment-advisor-exam' site/tg/index.html

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          base=Path('site/fund-assistant')
          x=json.loads((base/'release.json').read_text(encoding='utf-8'))
          entry=x['entry']; behavior=x.get('behavior',''); release=x['release']
          ep=base/entry
          assert ep.is_file(), entry
          body=ep.read_text(encoding='utf-8')
          assert '<html' in body.lower() and '</html>' in body.lower()
          assert 'document.write' not in body
          assets=sorted(set(re.findall(r'(?:src|href)="([^"?]+\.(?:js|css))',body)))
          for asset in assets:
              assert (base/asset).is_file(), asset
          if behavior:
              bp=base/behavior
              assert bp.is_file(), behavior
              js=bp.read_text(encoding='utf-8')
              assert release in js or release in body
          if entry.startswith('v14'):
              assert behavior=='v14.js'
              assert '妈妈' not in body
              for phrase in ['正式净值','盘中估算','基金代码或名称','买基金的4条基础原则']:
                  assert phrase in body, phrase
              for required in ['page-today','page-holdings','page-discover','page-search','detailSheet','holdingList','candidateList','dailyLesson']:
                  assert f'id="{required}"' in body, required
          print(f'Fund static release PASS: {entry} / {behavior}')
          PY
          behavior="$(python3 -c "import json;print(json.load(open('site/fund-assistant/release.json')).get('behavior',''))")"
          if [[ -n "$behavior" ]]; then node --check "site/fund-assistant/$behavior"; fi

          if grep -Fq 'v3.5.0' site/ks/index.html; then
            for f in product-v350.css product-core-v350.js product-v350.js sources-data-v350.js sw.js manifest.webmanifest; do test -f "site/securities-exam/$f"; done
            grep -Fq 'data-product-version="3.5.0"' site/securities-exam/index.html
            grep -Fq 'product-v350.css?v=350' site/securities-exam/index.html
            grep -Fq 'product-core-v350.js?v=350' site/securities-exam/index.html
            grep -Fq 'sources-data-v350.js?v=350' site/securities-exam/index.html
            grep -Fq 'product-v350.js?v=350' site/securities-exam/index.html
            ! grep -Fq 'ui-pro-r2.js' site/securities-exam/index.html
            ! grep -Fq 'release-v24.js' site/securities-exam/index.html
            grep -Fq "VERSION='3.5.0'" site/securities-exam/product-v350.js
            grep -Fq 'while(ps.length<2)' site/securities-exam/product-v350.js
            grep -Fq 'sec_v350_active' site/securities-exam/product-v350.js
            grep -Fq '今天只完成这些' site/securities-exam/product-v350.js
            grep -Fq 'ACTIVE RECALL' site/securities-exam/product-v350.js
            grep -Fq '我为什么会错？' site/securities-exam/product-v350.js
            ! grep -Fq 'setInterval(' site/securities-exam/product-v350.js
            grep -Fq 'sec2026-v350' site/securities-exam/sw.js
            node --check site/securities-exam/product-core-v350.js
            node --check site/securities-exam/sources-data-v350.js
            node --check site/securities-exam/product-v350.js
            python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('site/securities-exam/sources-data-v350.js').read_text(encoding='utf-8')
          urls=re.findall(r'https://www\.kdocs\.cn/l/[A-Za-z0-9]+',s)
          assert len(urls)==17 and len(set(urls))==17
          assert len(re.findall(r"id:'law-",s))==7 and len(re.findall(r"id:'finance-",s))==10
          p=Path('site/securities-exam/product-v350.js').read_text(encoding='utf-8')
          for x in ['核心定义','考试通常怎么考','常见错误','易混说法','具体例子','知识没记住','概念混淆','看错题干']:
              assert x in p, x
          print('Securities v3.5 static PASS')
          PY
          elif grep -Fq 'v3.4.0' site/ks/index.html; then
            test -f site/securities-exam/ui-pro-r2.js
            grep -Fq "VERSION='3.4.0'" site/securities-exam/ui-pro-r2.js
            echo 'Securities v3.4 transition PASS'
          else
            grep -Fq 'securities-exam' site/ks/index.html
          fi
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - id: deployment
        uses: actions/deploy-pages@v4
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify live endpoints and version
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonkaunwa-commits.github.io/freedom-road-public'
          get(){ curl -fsSL --max-time 30 --retry 3 "$base/$1?verify=${GITHUB_SHA}"; }
          for path in '' 'publication.json' 'fund-assistant/' 'securities-exam/' 'ks/' 'investment-advisor-exam/' 'tg/'; do
            ok=false; for attempt in {1..24}; do if get "$path" >/dev/null; then ok=true; break; fi; sleep 5; done
            [[ "$ok" == true ]] || { echo "Endpoint failed: $path" >&2; exit 1; }
          done
          python3 - <<'PY' >/tmp/fund-meta
          import json
          x=json.load(open('site/fund-assistant/release.json'));print(x['version']);print(x['release']);print(x['entry']);print(x.get('behavior',''))
          PY
          mapfile -t fm </tmp/fund-meta

          # Verify the actual live fund release, not only the folder URL.
          live_release="$(get 'fund-assistant/release.json')"
          grep -Fq "${fm[0]}" <<<"$live_release"
          grep -Fq "${fm[1]}" <<<"$live_release"
          grep -Fq "${fm[2]}" <<<"$live_release"
          live_entry="$(get "fund-assistant/${fm[2]}")"
          grep -Fq "${fm[1]}" <<<"$live_entry"
          if [[ -n "${fm[3]}" ]]; then
            live_behavior="$(get "fund-assistant/${fm[3]}")"
            grep -Fq "${fm[1]}" <<<"$live_behavior"
          fi
          if [[ "${fm[2]}" == v14* ]]; then
            grep -Fq 'id="page-today"' <<<"$live_entry"
            grep -Fq 'id="page-holdings"' <<<"$live_entry"
            grep -Fq 'id="page-discover"' <<<"$live_entry"
            grep -Fq 'id="page-search"' <<<"$live_entry"
            grep -Fq '盘中估算' <<<"$live_entry"
            grep -Fq '基金代码或名称' <<<"$live_entry"
            ! grep -Fq '妈妈' <<<"$live_entry"
            css="$(get 'fund-assistant/v14.css')"; grep -Fq '.bottom-nav' <<<"$css"; grep -Fq '.hero-card' <<<"$css"
            grep -Fq 'saveIntradaySample' <<<"$live_behavior"
            grep -Fq '10*60*1000' <<<"$live_behavior"
            grep -Fq '30*60*1000' <<<"$live_behavior"
          fi

          cat > /tmp/fund-release-status.txt <<EOF
          status=ok
          architecture=static-direct
          deployed_sha=${GITHUB_SHA}
          version=${fm[0]}
          release=${fm[1]}
          url=${base}/fund-assistant/
          entry=${fm[2]}
          behavior=${fm[3]}
          live_entry_verified=true
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          if grep -Fq 'v3.5.0' site/ks/index.html; then
            b="$(get 'securities-exam/')"; grep -Fq 'data-product-version="3.5.0"' <<<"$b"; grep -Fq 'product-v350.js?v=350' <<<"$b"
            b="$(get 'securities-exam/product-core-v350.js')"; grep -Fq "VERSION='3.5.0'" <<<"$b"; grep -Fq 'buildPlan' <<<"$b"
            b="$(get 'securities-exam/product-v350.js')"; grep -Fq '今天只完成这些' <<<"$b"; grep -Fq 'ACTIVE RECALL' <<<"$b"; grep -Fq '我为什么会错？' <<<"$b"
            b="$(get 'securities-exam/sw.js')"; grep -Fq 'sec2026-v350' <<<"$b"
            b="$(get 'ks/')"; grep -Fq 'v3.5.0' <<<"$b"
            cat > /tmp/securities-release-status.txt <<EOF
          status=ok
          architecture=exam-prep-system-v1
          deployed_sha=${GITHUB_SHA}
          version=3.5.0
          ui=PM-V1
          plan=adaptive-nonempty
          knowledge=active-recall-rich-cards
          review=explanation-error-attribution-spaced
          accounts=two-local-profiles
          source_count=17
          url=${base}/ks/
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          elif grep -Fq 'v3.4.0' site/ks/index.html; then
            cat > /tmp/securities-release-status.txt <<EOF
          status=ok
          architecture=learning-workspace-r2
          deployed_sha=${GITHUB_SHA}
          version=3.4.0
          ui=R2
          url=${base}/ks/
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          fi
      - name: Record live verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          cp /tmp/fund-release-status.txt release-status/fund-assistant.txt
          [[ ! -f /tmp/securities-release-status.txt ]] || cp /tmp/securities-release-status.txt release-status/securities-exam.txt
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status
          if ! git diff --cached --quiet; then git commit -m 'status: live release verification passed'; git push; fi
