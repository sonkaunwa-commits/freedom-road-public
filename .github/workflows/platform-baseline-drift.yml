name: platform-baseline-drift

on:
  pull_request:
    paths:
      - 'DESIGN.md'
      - 'design/**'
      - 'research_orchestrator/**'
      - 'model_router/**'
      - 'skill_registry/**'
      - 'creator_engine/**'
      - 'evaluation_engine/**'
      - 'multi_model_review/**'
      - 'skill_health/**'
      - 'content_feedback/**'
      - 'platform_baseline/**'
      - 'platform_baseline_tests/**'
      - 'scripts/check_platform_baseline_drift.py'
      - 'scripts/platform_rebaseline_proposal.py'
      - '.github/workflows/platform-baseline-drift.yml'
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest platform_baseline_tests.test_baseline_drift platform_baseline_tests.test_rebaseline_proposal
      - run: python scripts/check_platform_baseline_drift.py --target-ref HEAD --json
