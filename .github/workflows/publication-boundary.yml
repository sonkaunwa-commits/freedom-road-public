name: publication-boundary

on:
  pull_request:
    paths:
      - 'publication_boundary/**'
      - 'scripts/validate_publication_boundary.py'
      - 'scripts/test_publication_boundary.py'
      - '.github/workflows/publication-boundary.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test_publication_boundary.py
      - run: python scripts/validate_publication_boundary.py --json
