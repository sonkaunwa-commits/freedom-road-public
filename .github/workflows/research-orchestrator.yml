name: research-orchestrator

on:
  pull_request:
    paths:
      - 'research_orchestrator/**'
      - 'scripts/validate_research_orchestrator.py'
      - '.github/workflows/research-orchestrator.yml'
  push:
    branches: [main]
    paths:
      - 'research_orchestrator/**'
      - 'scripts/validate_research_orchestrator.py'
      - '.github/workflows/research-orchestrator.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_research_orchestrator.py
