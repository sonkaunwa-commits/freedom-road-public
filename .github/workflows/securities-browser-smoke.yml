name: securities-browser-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/securities-exam/**
      - site/exam-live/**
      - site/ks/**
      - scripts/securities-browser-smoke-r4.cjs
      - .github/workflows/securities-browser-smoke.yml

permissions:
  contents: write

concurrency:
  group: securities-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test runtime
        id: install
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Wait for clean release on real Pages
        id: live
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonkaunwa-commits.github.io/freedom-road-public'
          ok=false
          for attempt in {1..72}; do
            ks="$(curl -fsSL --max-time 20 "$base/ks/?browserwait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            live="$(curl -fsSL --max-time 20 "$base/exam-live/?browserwait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            if grep -Fq 'exam-live/?v=20260825-r4' <<<"$ks" && grep -Fq 'data-product-version="3.6.0"' <<<"$live" && ! grep -Fq 'serviceWorker.register' <<<"$live"; then ok=true; break; fi
            sleep 5
          done
          [[ "$ok" == true ]] || { echo 'Clean exam-live release not live before browser smoke' >&2; exit 1; }
      - name: Run real Chromium and WebKit smoke
        id: smoke
        continue-on-error: true
        env:
          SECURITIES_BASE: https://sonkaunwa-commits.github.io/freedom-road-public
        shell: bash
        run: |
          set -o pipefail
          node scripts/securities-browser-smoke-r4.cjs 2>&1 | tee /tmp/securities-browser-smoke.log
      - name: Write real-browser certificate
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          if [[ "$SMOKE_OUTCOME" == success ]]; then overall=ok; else overall=failed; fi
          cat > release-status/securities-browser-smoke.txt <<EOF
          status=${overall}
          tested_sha=${GITHUB_SHA}
          browsers=chromium+webkit
          install=${INSTALL_OUTCOME}
          live_wait=${LIVE_OUTCOME}
          browser_smoke=${SMOKE_OUTCOME}
          desktop=chromium-exam-live-home+knowledge+practice+profiles+pin
          mobile=chromium-ks-to-exam-live+webkit-iphone-ks-to-exam-live+home+knowledge
          entry=clean-no-service-worker-r4
          cloud_sync=false
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          if [[ -f /tmp/securities-browser-smoke.log ]]; then tail -n 80 /tmp/securities-browser-smoke.log > release-status/securities-browser-smoke.log; else echo 'browser smoke did not start' > release-status/securities-browser-smoke.log; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/securities-browser-smoke.txt release-status/securities-browser-smoke.log
          if ! git diff --cached --quiet; then git commit -m 'status: record securities real-browser smoke'; git push; fi
      - name: Enforce browser smoke result
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: test "$SMOKE_OUTCOME" = success
