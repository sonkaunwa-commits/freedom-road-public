name: securities-browser-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/securities-exam/**
      - site/ks/**
      - scripts/securities-browser-smoke.cjs
      - .github/workflows/securities-browser-smoke.yml

permissions:
  contents: write

concurrency:
  group: securities-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser test runtime
        id: install
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for recovery release on real Pages
        id: live
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonkaunwa-commits.github.io/freedom-road-public'
          ok=false
          for attempt in {1..72}; do
            ks="$(curl -fsSL --max-time 20 "$base/ks/?browserwait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            boot="$(curl -fsSL --max-time 20 "$base/securities-exam/boot.html?browserwait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            sw="$(curl -fsSL --max-time 20 "$base/securities-exam/sw.js?browserwait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            if grep -Fq 'boot.html?v=20260825-r2' <<<"$ks" && grep -Fq 'RECOVERY ENTRY' <<<"$boot" && grep -Fq 'sec2026-v361-recovery' <<<"$sw"; then ok=true; break; fi
            sleep 5
          done
          [[ "$ok" == true ]] || { echo 'Recovery release not live before browser smoke' >&2; exit 1; }
      - name: Run real Chromium smoke
        id: smoke
        env:
          SECURITIES_BASE: https://sonkaunwa-commits.github.io/freedom-road-public
        run: node scripts/securities-browser-smoke.cjs
      - name: Write real-browser certificate
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          if [[ "$SMOKE_OUTCOME" == success ]]; then overall=ok; else overall=failed; fi
          cat > release-status/securities-browser-smoke.txt <<EOF
          status=${overall}
          tested_sha=${GITHUB_SHA}
          browser=chromium
          install=${INSTALL_OUTCOME}
          live_wait=${LIVE_OUTCOME}
          browser_smoke=${SMOKE_OUTCOME}
          desktop=direct-securities-exam-home+knowledge+practice+profiles+pin
          mobile=ks-recovery+home+knowledge
          typography=desktop14+mobile17+
          cloud_sync=false
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/securities-browser-smoke.txt
          if ! git diff --cached --quiet; then git commit -m 'status: record securities real-browser smoke'; git push; fi
