name: securities-v360-live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/securities-exam/**
      - site/exam-live/**
      - site/ks/**
      - .github/workflows/securities-v360-live.yml

permissions:
  contents: write

concurrency:
  group: securities-v360-live
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean v3.6 entry and assets
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'exam-live/?v=20260825-r4' site/ks/index.html
          grep -Fq 'data-product-version="3.6.0"' site/exam-live/index.html
          ! grep -Fq 'serviceWorker.register' site/exam-live/index.html
          for f in product-core-v350.js product-v350.js product-v350.css learning-content-v360.js content-bridge-v360.js release-v360.js release-v360.css profile-sync-v360.js ui-tune-v360.css sources-data-v350.js questions-v1.js; do test -f "site/exam-live/$f"; done
          node --check site/exam-live/product-core-v350.js
          node --check site/exam-live/learning-content-v360.js
          node --check site/exam-live/content-bridge-v360.js
          node --check site/exam-live/product-v350.js
          node --check site/exam-live/release-v360.js
          node --check site/exam-live/profile-sync-v360.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          base=Path('site/exam-live')
          html=(base/'index.html').read_text(encoding='utf-8')
          for asset in sorted(set(re.findall(r'(?:src|href)="\./([^"?]+\.(?:js|css|webmanifest))',html))):
              assert (base/asset).is_file(), asset
          s=(base/'learning-content-v360.js').read_text(encoding='utf-8')
          assert s.count("sourceKind:'user-material-derived'") >= 20
          print('clean v3.6 static entry PASS')
          PY
      - name: Wait for GitHub Pages and smoke real clean entry
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonkaunwa-commits.github.io/freedom-road-public'
          get(){ curl -fsSL --max-time 25 --retry 2 "$base/$1?v360verify=${GITHUB_SHA}-$2" 2>/dev/null || true; }
          ok=false
          for attempt in {1..72}; do
            ks="$(get 'ks/' "$attempt")"
            live="$(get 'exam-live/' "$attempt")"
            rel="$(get 'exam-live/release-v360.js' "$attempt")"
            learn="$(get 'exam-live/learning-content-v360.js' "$attempt")"
            profile="$(get 'exam-live/profile-sync-v360.js' "$attempt")"
            if grep -Fq 'exam-live/?v=20260825-r4' <<<"$ks" && grep -Fq 'data-product-version="3.6.0"' <<<"$live" && ! grep -Fq 'serviceWorker.register' <<<"$live" && grep -Fq "const VERSION='3.6.0'" <<<"$rel" && grep -Fq 'SEC_SOURCE_CONTENT_V360' <<<"$learn" && grep -Fq 'cloudSync:false' <<<"$profile"; then ok=true; break; fi
            sleep 5
          done
          [[ "$ok" == true ]] || { echo 'Clean v3.6 release did not become live in time' >&2; exit 1; }
          python3 - <<'PY' >/tmp/securities-assets
          import re
          from pathlib import Path
          html=Path('site/exam-live/index.html').read_text(encoding='utf-8')
          for x in sorted(set(re.findall(r'(?:src|href)="\./([^"?]+\.(?:js|css|webmanifest))',html))): print(x)
          PY
          while IFS= read -r asset; do
            body="$(get "exam-live/$asset" "asset")"
            [[ -n "$body" ]] || { echo "Public asset failed: $asset" >&2; exit 1; }
          done </tmp/securities-assets
      - name: Write securities v3.6 live certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-status
          cat > release-status/securities-exam.txt <<EOF
          status=ok
          architecture=exam-prep-system-v2
          deployed_sha=${GITHUB_SHA}
          version=3.6.0
          ui=PM-V2
          plan=adaptive-nonempty
          knowledge=active-recall-source-grounded-course-bridge
          review=explanation-error-attribution-spaced
          accounts=two-local-profiles
          source_grounded_cards=24+
          kdocs_sources=17
          courses=finance+law
          entry=exam-live
          service_worker=disabled-on-clean-entry
          url=https://sonkaunwa-commits.github.io/freedom-road-public/ks/
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-status/securities-exam.txt
          if ! git diff --cached --quiet; then git commit -m 'status: certify clean securities v3.6.0 release'; git push; fi
