name: securities-v4-smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - site/index.html
      - site/quiz-v4/**
      - site/ks/**
      - site/securities-exam/index.html
      - scripts/securities-v4-smoke.cjs
      - .github/workflows/securities-v4-smoke.yml

permissions:
  contents: write

concurrency:
  group: securities-v4-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        id: install
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || npm init -y >/dev/null
          npm install --no-save --package-lock=false playwright@1.55.0
      - name: Wait for complete v4.3 release on real Pages
        id: live
        shell: bash
        run: |
          set -euo pipefail
          base='https://sonkaunwa-commits.github.io/freedom-road-public'
          ok=false
          for attempt in {1..72}; do
            html="$(curl -fsSL --max-time 20 "$base/quiz-v4/?wait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            bank="$(curl -fsSL --max-time 20 "$base/quiz-v4/bank-highvalue-v43.js?wait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            sync="$(curl -fsSL --max-time 20 "$base/quiz-v4/cloud-sync-v43.js?wait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            runtime="$(curl -fsSL --max-time 20 "$base/quiz-v4/v43-runtime.js?wait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            ks="$(curl -fsSL --max-time 20 "$base/ks/?wait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 20 "$base/?wait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            legacy="$(curl -fsSL --max-time 20 "$base/securities-exam/?wait=${GITHUB_SHA}-$attempt" 2>/dev/null || true)"
            if grep -Fq '证券从业刷题 · v4.3' <<<"$html" \
              && grep -Fq "window.SEC_V43_BANK" <<<"$bank" \
              && grep -Fq "cloudSync:true" <<<"$sync" \
              && grep -Fq "version:'4.3.0'" <<<"$runtime" \
              && grep -Fq '../quiz-v4/' <<<"$ks" \
              && grep -Fq 'href="ks/?v=20260826-v4"' <<<"$root" \
              && grep -Fq '../quiz-v4/' <<<"$legacy"; then
              ok=true
              break
            fi
            sleep 5
          done
          [[ "$ok" == true ]] || { echo 'complete v4.3 release entries were not live before browser smoke' >&2; exit 1; }
      - name: Run real account and cross-device browser smoke
        id: smoke
        continue-on-error: true
        env:
          SECURITIES_BASE: https://sonkaunwa-commits.github.io/freedom-road-public
        shell: bash
        run: |
          set -o pipefail
          node scripts/securities-v4-smoke.cjs 2>&1 | tee /tmp/securities-v4-smoke.log
      - name: Write v4.3 browser certificate
        if: always()
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          LIVE_OUTCOME: ${{ steps.live.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          status_tmp="$(mktemp -d)"
          if [[ "$SMOKE_OUTCOME" == success ]]; then overall=ok; else overall=failed; fi
          cat > "$status_tmp/securities-v4-smoke.txt" <<EOF
          status=${overall}
          tested_sha=${GITHUB_SHA}
          version=4.3.0
          formal_entry=/ks/
          legacy_entry=/securities-exam/
          browsers=chromium-desktop+chromium-mobile+webkit-iphone
          install=${INSTALL_OUTCOME}
          live_wait=${LIVE_OUTCOME}
          browser_smoke=${SMOKE_OUTCOME}
          flows=formal-entry+cloud-register+cloud-login+remembered-session+same-account-cross-device-sync+separate-account-isolation+no-direct-profile-switch+quality-pool+question+wrong-answer+deep-explanation+transfer-practice+mastery+favourite+root-card+legacy-redirect
          layout=mobile-first-max-520px
          question_policy=A-B-C-default+D-quarantined+v43-high-value-expansion
          account_model=username-password+isolated-server-state
          cloud_sync=true
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          if [[ -f /tmp/securities-v4-smoke.log ]]; then
            tail -n 160 /tmp/securities-v4-smoke.log > "$status_tmp/securities-v4-smoke.log"
          else
            echo 'v4.3 browser smoke did not start' > "$status_tmp/securities-v4-smoke.log"
          fi
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p release-status
            cp "$status_tmp/securities-v4-smoke.txt" release-status/securities-v4-smoke.txt
            cp "$status_tmp/securities-v4-smoke.log" release-status/securities-v4-smoke.log
            git add release-status/securities-v4-smoke.txt release-status/securities-v4-smoke.log
            if git diff --cached --quiet; then echo 'v4.3 browser certificate already current'; break; fi
            git commit -m 'status: record securities v4.3 browser smoke'
            if git push origin HEAD:main; then break; fi
            if [[ "$attempt" == 5 ]]; then echo 'Could not persist v4.3 browser certificate after retries.' >&2; exit 1; fi
            sleep 2
          done
      - name: Enforce v4.3 browser smoke result
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: test "$SMOKE_OUTCOME" = success
