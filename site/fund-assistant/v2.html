<!doctype html>
<html lang="zh-CN">
<head>

<title>基金小助手</title>
<style>
:root{--bg:#f4f5f1;--card:#fff;--text:#202420;--muted:#727a73;--line:#e4e8e2;--green:#235a45;--green2:#e9f3ed;--amber:#885d17;--amber2:#fff5df;--red:#9c423b;--red2:#fbeceb;--blue:#385f8a;--blue2:#eef4fb;--shadow:0 12px 32px rgba(25,36,29,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;-webkit-font-smoothing:antialiased}.wrap{max-width:720px;margin:0 auto;padding:18px 15px 54px}.hero{padding:14px 4px 10px}.brand{display:flex;align-items:center;gap:11px}.logo{width:44px;height:44px;border-radius:15px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:900;box-shadow:var(--shadow)}h1{font-size:27px;margin:0;line-height:1.15}.sub{font-size:15px;color:var(--muted);line-height:1.6;margin-top:7px}.pill{display:inline-flex;margin-top:10px;padding:7px 10px;border-radius:999px;background:var(--green2);color:var(--green);font-size:13px;font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px;box-shadow:var(--shadow)}.label{font-size:14px;font-weight:800;margin:0 0 8px}.input{width:100%;border:1px solid #d7ddd7;border-radius:15px;padding:14px;font-size:17px;background:#fff;outline:none}.input:focus{border-color:#94ad9d;box-shadow:0 0 0 3px rgba(35,90,69,.08)}.question-row{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:stretch}textarea.input{min-height:84px;resize:vertical;font-size:15px;line-height:1.55}.voice{width:58px;border:1px solid #d7ddd7;border-radius:15px;background:#fff;color:var(--green);font-size:24px;display:grid;place-items:center}.voice.on{background:var(--green);color:#fff;border-color:var(--green)}.voice small{display:block;font-size:9px;font-weight:800;margin-top:-4px}.voice-wrap{display:flex;flex-direction:column}.voice-hint{font-size:11px;color:var(--muted);text-align:center;margin-top:5px}.examples,.quick{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding:2px 0 3px}.examples::-webkit-scrollbar,.quick::-webkit-scrollbar{display:none}.ex,.chip{border:1px solid var(--line);background:#fff;color:#465049;border-radius:999px;padding:9px 11px;white-space:nowrap;font-size:13px}.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;font-size:17px;font-weight:850;background:var(--green);color:#fff;margin-top:13px;box-shadow:0 8px 18px rgba(35,90,69,.18)}.btn:disabled{opacity:.55}.notice{font-size:12px;color:var(--muted);line-height:1.65;background:#f1f4f1;border-radius:14px;padding:10px 12px;margin-top:11px}.hidden{display:none!important}.loading{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.spinner{width:18px;height:18px;border:2px solid #d9dfda;border-top-color:var(--green);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.topline{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.fname{font-size:21px;font-weight:900;line-height:1.35}.fcode{font-size:13px;color:var(--muted);margin-top:4px}.tag{padding:7px 9px;border-radius:10px;background:var(--green2);color:var(--green);font-size:12px;font-weight:800;white-space:nowrap}.decision{margin-top:14px;padding:15px 16px;border-radius:18px;background:var(--green2)}.decision.warn{background:var(--amber2)}.decision.bad{background:var(--red2)}.decision-title{font-size:12px;color:var(--muted);font-weight:750}.decision-main{font-size:23px;font-weight:900;margin-top:4px}.decision-desc{font-size:14px;line-height:1.7;color:#48504a;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.metric{border:1px solid var(--line);border-radius:15px;padding:11px}.k{font-size:11px;color:var(--muted)}.v{font-size:18px;font-weight:850;margin-top:4px;line-height:1.25}.d{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}.section-title{font-size:17px;font-weight:900;margin:18px 0 9px}.facts{display:grid;gap:8px}.fact{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #efefeb;padding:10px 0;font-size:14px;line-height:1.5}.fact:first-child{border-top:0}.fact span:first-child{color:var(--muted)}.fact span:last-child{text-align:right;font-weight:700}.reason{display:flex;gap:10px;padding:10px 0;border-top:1px solid #efefeb}.reason:first-child{border-top:0}.num{width:25px;height:25px;flex:0 0 25px;border-radius:8px;background:#f1f3f0;display:grid;place-items:center;font-size:12px;font-weight:900}.reason p{margin:0;font-size:14px;line-height:1.65}.chartbox{border:1px solid var(--line);border-radius:16px;padding:10px 8px 5px;margin-top:10px}.charthead{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding:0 3px 7px}svg{width:100%;height:126px;display:block}.mini-badge{display:inline-flex;padding:5px 8px;border-radius:8px;background:var(--blue2);color:var(--blue);font-size:11px;font-weight:750;margin-right:5px;margin-top:5px}.error{color:var(--red);font-size:14px;line-height:1.65}.footer{text-align:center;font-size:11px;color:#969d97;line-height:1.7;margin-top:20px}.recent-title{font-size:12px;color:var(--muted);margin:12px 0 6px}.recent-list{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.recent-list::-webkit-scrollbar{display:none}.recent-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:12px;white-space:nowrap}.source{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}.voice-status{font-size:12px;color:var(--green);font-weight:700;margin:7px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.soft{border:1px solid var(--line);background:#f8f9f7;border-radius:10px;padding:8px 10px;font-size:12px;color:#505852}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="brand"><div class="logo">基</div><div><h1>基金小助手</h1><div class="sub">先把基金数据看清楚，再决定买、拿、补还是卖。</div></div></div>
    <div class="pill">不需要填写总资产 · 支持语音提问</div>
  </div>
  <div class="card">
    <div class="label">基金代码</div>
    <input id="code" class="input" inputmode="numeric" maxlength="6" placeholder="输入6位基金代码，例如 161725">
    <div class="examples" style="margin-top:9px">
      <button class="ex" data-code="161725">161725 白酒</button><button class="ex" data-code="110022">110022 消费</button><button class="ex" data-code="000478">000478 中证500</button><button class="ex" data-code="000217">000217 黄金</button>
    </div>
    <div class="label" style="margin-top:16px">想问什么？可以直接说</div>
    <div class="question-row"><textarea id="question" class="input" placeholder="例如：这只现在能买吗？我已经亏了8%，还要不要拿？"></textarea><div class="voice-wrap"><button id="voice" class="voice" aria-label="语音输入"><span>🎙️</span></button><div class="voice-hint">按一下说话</div></div></div>
    <div id="voiceStatus" class="voice-status hidden"></div>
    <div class="quick" style="margin-top:9px"><button class="chip">现在能买吗？</button><button class="chip">要不要继续拿？</button><button class="chip">跌了要不要补？</button><button class="chip">涨了要不要卖？</button><button class="chip">这只基金质量怎么样？</button></div>
    <button id="go" class="btn">帮我分析</button>
    <div class="notice">当前演示版会读取公开基金净值、阶段收益、回撤，并尽量读取基金经理、规模/仓位等公开信息。数据取不到时会明确显示，不会自己编。语音按钮是否可直接使用取决于手机浏览器；如果不支持，可以使用手机输入法自带的麦克风。</div>
    <div id="recent" class="hidden"><div class="recent-title">最近看过</div><div id="recentList" class="recent-list"></div></div>
  </div>
  <div id="status" class="card hidden"></div><div id="result" class="card hidden"></div><div class="footer">基金投资有风险。这里提供的是研究参考，不自动交易，也不承诺收益。</div>
</div>
<script>
const $=s=>document.querySelector(s);const codeEl=$('#code'),qEl=$('#question'),go=$('#go'),status=$('#status'),result=$('#result'),voiceBtn=$('#voice'),voiceStatus=$('#voiceStatus');
const GLOBALS=['fS_name','fS_code','fundName','fundcode','Data_netWorthTrend','Data_ACWorthTrend','Data_currentFundManager','Data_assetAllocation','Data_fluctuationScale','Data_rateInSimilarType','Data_rateInSimilarPersent','Data_performanceEvaluation','stockCodes','stockCodesNew','syl_1n','syl_6y','syl_3y','syl_1y','fund_sourceRate','fund_Rate','fund_minsg'];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function num(v){const n=Number(v);return Number.isFinite(n)?n:null}function fmtPct(v){return v===null||!Number.isFinite(v)?'—':(v>0?'+':'')+v.toFixed(2)+'%'}function pct(a,b){return b?((a/b)-1)*100:null}function fmtDate(ts){const d=new Date(ts);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function loadScript(src,timeout=9000){return new Promise((resolve,reject)=>{const s=document.createElement('script');let done=false;const timer=setTimeout(()=>{if(!done){done=true;s.remove();reject(new Error('数据请求超时'))}},timeout);s.src=src;s.onload=()=>{if(!done){done=true;clearTimeout(timer);s.remove();resolve()}};s.onerror=()=>{if(!done){done=true;clearTimeout(timer);s.remove();reject(new Error('公开数据源暂时不可用'))}};document.head.appendChild(s)})}
function snapshotGlobals(){const o={};for(const k of GLOBALS)o[k]=window[k];return o}function cleanGlobals(){for(const k of GLOBALS){try{window[k]=undefined}catch{}}}
function lastSeriesValue(obj){try{if(Array.isArray(obj)&&obj.length){const x=obj[obj.length-1];if(Array.isArray(x)&&x.length>=2)return num(x[1]);if(x&&typeof x==='object'){if('y' in x)return num(x.y);if('value' in x)return num(x.value)}}}catch{}return null}
function parseAssetAllocation(a){const out={};if(!Array.isArray(a))return out;for(const s of a){const name=s?.seriesName||s?.name||'';const v=lastSeriesValue(s?.seriesData||s?.data);if(v===null)continue;if(/股票/.test(name))out.stock=v;else if(/债券/.test(name))out.bond=v;else if(/现金|银行/.test(name))out.cash=v;}return out}function parseScale(a){if(!Array.isArray(a)||!a.length)return null;const s=a[0];return lastSeriesValue(s?.seriesData||s?.data||a)}function parseRank(a){if(!Array.isArray(a)||!a.length)return null;const x=a[a.length-1];if(Array.isArray(x)&&x.length>=2)return x[1];if(x&&typeof x==='object')return x.y??x.value??null;return null}function managerText(m){if(!Array.isArray(m)||!m.length)return '未取到';return m.slice(0,2).map(x=>x?.name||x?.managerName||x?.fundManagerName).filter(Boolean).join('、')||'未取到'}
function riskFromTrend(a){if(a.length<30)return '数据不足';const xs=a.slice(-120),daily=[];for(let i=1;i<xs.length;i++)daily.push((xs[i].v/xs[i-1].v-1)*100);const mean=daily.reduce((p,c)=>p+c,0)/daily.length;const sd=Math.sqrt(daily.reduce((p,c)=>p+(c-mean)*(c-mean),0)/daily.length);if(sd>2)return '较高';if(sd>1.2)return '中高';if(sd>.65)return '中等';return '较低'}
async function getEstimate(code){return new Promise(resolve=>{let settled=false;const cb='jsonpgz',old=window[cb];window[cb]=o=>{settled=true;window[cb]=old;resolve(o)};loadScript(`https://fundgz.1234567.com.cn/js/${code}.js?rt=${Date.now()}`,4500).catch(()=>{}).finally(()=>setTimeout(()=>{if(!settled){window[cb]=old;resolve(null)}},80));setTimeout(()=>{if(!settled){settled=true;window[cb]=old;resolve(null)}},5000)})}
async function getFund(code){cleanGlobals();await loadScript(`https://fund.eastmoney.com/pingzhongdata/${code}.js?v=${Date.now()}`);const g=snapshotGlobals(),name=g.fS_name||g.fundName;const trend=Array.isArray(g.Data_netWorthTrend)?g.Data_netWorthTrend.map(x=>({t:Number(x.x),v:Number(x.y)})).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.v)):[];if(!name||trend.length<5)throw new Error('没有查到这个基金，请检查6位基金代码');const est=await getEstimate(code);return {code,name,trend,est,manager:managerText(g.Data_currentFundManager),asset:parseAssetAllocation(g.Data_assetAllocation),scale:parseScale(g.Data_fluctuationScale),rank:parseRank(g.Data_rateInSimilarType),returns:{m1:num(g.syl_1y),m3:num(g.syl_3y),m6:num(g.syl_6y),y1:num(g.syl_1n)}}}
function analyze(f,q){const a=f.trend,n=a.length,last=a[n-1],v20=n>21?a[n-21].v:a[0].v,v60=n>61?a[n-61].v:a[0].v,v120=n>121?a[n-121].v:a[0].v,r20=pct(last.v,v20),r60=pct(last.v,v60),r120=pct(last.v,v120),slice=a.slice(Math.max(0,n-121)),high=Math.max(...slice.map(x=>x.v)),dd=pct(last.v,high);let level='继续观察',cls='',desc='暂时没有出现需要频繁交易的明确信号。基金投资更适合按趋势、回撤和基金质量综合判断。';if(r60!==null&&r60>15&&dd>-4){level='不建议追涨';cls='warn';desc='近阶段上涨较快，而且离阶段高点不远。已有持仓可以观察，新资金更适合等回调或分批。'}else if(r60!==null&&r60>3&&r20>0){level='持有为主，别急着追';desc='中短期走势偏强，但没必要因为几天上涨就连续加仓。'}else if(r60!==null&&r60<0&&dd<-12&&r20>0){level='可小额分批观察';desc='仍在明显回撤区，但近期出现一定修复。前提是基金本身质量和长期逻辑没有恶化。'}else if(r60!==null&&r60<0&&r20<0){level='暂时观望';cls='warn';desc='中短期仍偏弱。现在最重要的是确认基金本身是否值得继续持有，而不是因为跌得多就机械补仓。'}else if(r20!==null&&r20>8){level='不建议短期追买';cls='warn';desc='近20个交易日上涨偏快，短线追入的性价比下降。'}const qq=(q||'').replace(/\s/g,''),loss=qq.match(/亏(?:了)?(\d+(?:\.\d+)?)%?/),gain=qq.match(/(?:赚|盈利)(?:了)?(\d+(?:\.\d+)?)%?/);let personal='';if(loss){personal=`你提到目前约亏 ${Number(loss[1])}%。亏损本身不是补仓理由，先看基金质量和趋势；如果中短期仍弱，优先控制加仓节奏。`}else if(gain){personal=`你提到目前约盈利 ${Number(gain[1])}%。已有利润时不必因为一天上涨就卖，也不要忽视回撤；可以把是否接近阶段高位作为止盈参考。`}const reasons=[`近20个交易日约 ${fmtPct(r20)}，近60个交易日约 ${fmtPct(r60)}。`,`相对近120个交易日高点回撤约 ${fmtPct(dd)}，当前波动风险判断为 ${riskFromTrend(a)}。`,f.manager!=='未取到'?`公开资料读取到基金经理：${f.manager}。正式判断还应继续看经理任期、风格是否漂移和长期同类表现。`:'基金经理资料本次没有稳定取到，因此不把这一项作为买卖依据。'];return {r20,r60,r120,dd,level,cls,desc,personal,reasons,last,date:fmtDate(last.t)}}
function drawChart(a){const xs=a.slice(-120),vals=xs.map(x=>x.v),min=Math.min(...vals),max=Math.max(...vals),w=640,h=126,pad=7,span=max-min||1,pts=xs.map((x,i)=>`${pad+i*(w-2*pad)/(xs.length-1)},${h-pad-(x.v-min)*(h-2*pad)/span}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="#235a45" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>`}function fact(label,value){return `<div class="fact"><span>${esc(label)}</span><span>${esc(value)}</span></div>`}
function render(f,a){const est=f.est;let estText='未取到';if(est&&est.gsz)estText=`${est.gsz}${est.gszzl?`（${Number(est.gszzl)>0?'+':''}${est.gszzl}%）`:''}`;const asset=[];if(f.asset.stock!=null)asset.push(`股票 ${f.asset.stock.toFixed(1)}%`);if(f.asset.bond!=null)asset.push(`债券 ${f.asset.bond.toFixed(1)}%`);if(f.asset.cash!=null)asset.push(`现金 ${f.asset.cash.toFixed(1)}%`);const ret=f.returns;result.innerHTML=`<div class="topline"><div><div class="fname">${esc(f.name)}</div><div class="fcode">基金代码 ${esc(f.code)} · 净值数据日期 ${a.date}</div></div><div class="tag">已读取公开数据</div></div><div class="decision ${a.cls}"><div class="decision-title">当前参考结论</div><div class="decision-main">${esc(a.level)}</div><div class="decision-desc">${esc(a.desc)}${a.personal?'<br><br>'+esc(a.personal):''}</div></div><div class="grid"><div class="metric"><div class="k">最新单位净值</div><div class="v">${a.last.v.toFixed(4)}</div><div class="d">${a.date}</div></div><div class="metric"><div class="k">盘中估值</div><div class="v">${esc(estText)}</div><div class="d">估值仅供参考</div></div><div class="metric"><div class="k">近20日</div><div class="v">${fmtPct(a.r20)}</div><div class="d">按净值计算</div></div><div class="metric"><div class="k">阶段回撤</div><div class="v">${fmtPct(a.dd)}</div><div class="d">相对近120日高点</div></div></div><div class="section-title">基金本身再看几项</div><div class="facts">${fact('基金经理',f.manager)}${fact('近1月 / 3月',`${fmtPct(ret.m1)} / ${fmtPct(ret.m3)}`)}${fact('近6月 / 1年',`${fmtPct(ret.m6)} / ${fmtPct(ret.y1)}`)}${fact('资产配置',asset.length?asset.join(' · '):'本次未稳定取到')}${fact('基金规模',f.scale!=null?`${f.scale}（公开源口径）`:'本次未稳定取到')}${fact('同类排名数据',f.rank!=null?String(f.rank):'本次未稳定取到')}</div><div class="section-title">为什么这么判断</div>${a.reasons.map((x,i)=>`<div class="reason"><div class="num">${i+1}</div><p>${esc(x)}</p></div>`).join('')}<div class="section-title">近120个交易日净值走势</div><div class="chartbox"><div class="charthead"><span>阶段低 ${Math.min(...f.trend.slice(-120).map(x=>x.v)).toFixed(4)}</span><span>阶段高 ${Math.max(...f.trend.slice(-120).map(x=>x.v)).toFixed(4)}</span></div>${drawChart(f.trend)}</div><div class="section-title">接下来怎么做</div><div class="reason"><div class="num">✓</div><p>${a.level.includes('追')?'如果是新资金，不一次性追进去；等回调或分批更合适。':a.level.includes('观望')?'先不急着补仓，等走势止稳，并继续核对基金经理、持仓和对应行业。':'已有持仓以观察为主；没有明显逻辑变化时，不因为一天涨跌频繁交易。'}</p></div><div class="toolbar"><button class="soft" onclick="qEl.value='这只基金质量怎么样？';go.click()">继续看基金质量</button><button class="soft" onclick="qEl.value='如果已经持有，现在该怎么办？';go.click()">已有持仓怎么办</button></div><div class="source">数据说明：演示版从公开基金数据页面读取净值、历史走势及可获得的基金资料。任何字段如果没有稳定取得，会显示未取到，不用于强行推断。下一版可以再接持仓明细、基金经理任期、指数估值和同类基金横向比较，并加入真正的 AI 综合解释。</div>`;result.classList.remove('hidden')}
function getRecent(){try{return JSON.parse(localStorage.getItem('fund_recent_v2')||'[]')}catch{return[]}}function saveRecent(x){let a=getRecent().filter(i=>i.code!==x.code);a.unshift(x);a=a.slice(0,6);localStorage.setItem('fund_recent_v2',JSON.stringify(a));renderRecent()}function renderRecent(){const a=getRecent(),box=$('#recent'),list=$('#recentList');if(!a.length){box.classList.add('hidden');return}box.classList.remove('hidden');list.innerHTML=a.map(x=>`<button class="recent-btn" data-r="${esc(x.code)}">${esc(x.name||x.code)}</button>`).join('');list.querySelectorAll('button').forEach(b=>b.onclick=()=>{codeEl.value=b.dataset.r;go.click()})}renderRecent();document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>qEl.value=b.textContent);document.querySelectorAll('.ex').forEach(b=>b.onclick=()=>{codeEl.value=b.dataset.code;go.click()});
go.onclick=async()=>{const code=codeEl.value.trim();if(!/^\d{6}$/.test(code)){status.innerHTML='<div class="error">请输入6位基金代码。</div>';status.classList.remove('hidden');result.classList.add('hidden');return}go.disabled=true;status.innerHTML='<div class="loading"><div class="spinner"></div><span>正在核对基金净值、走势和公开资料…</span></div>';status.classList.remove('hidden');result.classList.add('hidden');try{const f=await getFund(code),a=analyze(f,qEl.value);render(f,a);saveRecent({code:f.code,name:f.name});status.classList.add('hidden')}catch(e){status.innerHTML=`<div class="error">${esc(e.message||'暂时没查到数据')}<br>可以稍后重试，或者先换一只基金代码。</div>`}finally{go.disabled=false}};
let recognition=null,listening=false;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){recognition=new SR();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;recognition.onstart=()=>{listening=true;voiceBtn.classList.add('on');voiceStatus.textContent='正在听，你直接说就可以…';voiceStatus.classList.remove('hidden')};recognition.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;qEl.value=text};recognition.onerror=e=>{voiceStatus.textContent=e.error==='not-allowed'?'没有获得麦克风权限，可以用手机输入法的语音键。':'这次没听清，再按一下试试。'};recognition.onend=()=>{listening=false;voiceBtn.classList.remove('on');if(qEl.value.trim())voiceStatus.textContent='已录入，可以直接点“帮我分析”';else voiceStatus.classList.add('hidden')};voiceBtn.onclick=()=>{try{if(listening)recognition.stop();else recognition.start()}catch{}}}else{voiceBtn.onclick=()=>{voiceStatus.textContent='当前浏览器不支持网页直接录音。请点输入框，再用手机输入法键盘上的麦克风说话。';voiceStatus.classList.remove('hidden')}}
