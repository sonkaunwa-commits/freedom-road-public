<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12233f">
<title>Freedom Road 工具入口</title>
<style>
:root{color-scheme:light;--bg:#f4f7fb;--card:#fff;--text:#132238;--muted:#667085;--line:#dce4ee;--blue:#175cd3}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:auto;padding:40px 16px 56px}.eyebrow{font-size:12px;color:var(--blue);font-weight:700;letter-spacing:.08em}.hero h1{font-size:30px;margin:8px 0}.hero p{margin:0;color:var(--muted);line-height:1.7}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin:28px 0 20px}.card{display:block;padding:20px;border:1px solid var(--line);border-radius:20px;background:#fff;color:inherit;text-decoration:none}.card h2{font-size:18px;margin:0 0 7px}.card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.go{display:block;margin-top:16px;color:var(--blue);font-size:12px;font-weight:700}.data{padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:12px;color:var(--muted)}.data a{color:var(--blue)}
</style>
</head>
<body>
<main>
<section class="hero"><div class="eyebrow">FREEDOM ROAD</div><h1>常用工具</h1><p>当前保留的公开工具入口。</p></section>
<nav class="grid" aria-label="常用工具">
<a class="card" href="fund-assistant/"><h2>基金小帮手</h2><p>查看基金机会池、持仓搭配和基金信息。</p><span class="go">直接进入 →</span></a>
</nav>
<div class="data">公开数据接口：<a href="latest/manifest.json">查看最新数据清单</a></div>
</main>
</body>
</html>
