<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache,no-store,must-revalidate">
<meta name="theme-color" content="#243c97">
<title>正在修复并进入证券考试学习助手</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#171a22;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:560px;margin:0 auto;padding:72px 20px}.card{background:#fff;border:1px solid #e3e6ec;border-radius:22px;padding:28px;box-shadow:0 10px 30px rgba(24,29,45,.06)}.tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:#243c97}.card h1{font-size:24px;margin:10px 0 8px}.card p{font-size:14px;line-height:1.7;color:#667085}.bar{height:8px;background:#edf0f5;border-radius:99px;overflow:hidden;margin:22px 0 12px}.bar i{display:block;width:12%;height:100%;background:#243c97;border-radius:99px;transition:width .25s}.status{font-size:13px;color:#475467}.detail{font-size:12px;color:#b42318;white-space:pre-wrap;margin-top:10px}.actions{display:flex;gap:10px;margin-top:20px}.actions a,.actions button{min-height:42px;padding:0 14px;border-radius:10px;border:1px solid #d0d5dd;background:#fff;color:#344054;font:inherit;text-decoration:none;display:inline-flex;align-items:center}.actions .primary{background:#243c97;color:#fff;border-color:#243c97}@media(max-width:560px){main{padding:36px 14px}.card{padding:22px}}
</style>
</head>
<body>
<main><section class="card"><div class="tag">SECURITIES 2026 · RECOVERY ENTRY</div><h1>正在进入学习助手</h1><p>先清理旧版离线缓存并检查核心资源，避免手机或电脑继续打开过期页面。</p><div class="bar"><i id="bar"></i></div><div class="status" id="status">正在准备…</div><div class="detail" id="detail"></div><div class="actions"><button class="primary" id="retry" hidden>重新检查</button><a href="./?v=20260825-r2">直接进入</a></div></section></main>
<script>
(()=>{
'use strict';
const status=document.getElementById('status'),detail=document.getElementById('detail'),bar=document.getElementById('bar'),retry=document.getElementById('retry');
const ASSETS=['./index.html','./style-v1.css','./product-v350.css','./release-v360.css','./ui-tune-v360.css','./questions-v1.js','./bank/concepts-v2.js','./bank/generator-v2.js','./app-v1.js','./product-core-v350.js','./sources-data-v350.js','./learning-content-v360.js','./content-bridge-v360.js','./product-v350.js','./release-v360.js','./profile-sync-v360.js','./sw.js'];
const set=(text,pct)=>{status.textContent=text;bar.style.width=Math.max(12,pct)+'%'};
async function clearOld(){set('正在清理旧版缓存…',24);const jobs=[];try{if('serviceWorker'in navigator)jobs.push(navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.filter(r=>{try{return new URL(r.scope).pathname.includes('/securities-exam/')}catch(_){return false}}).map(r=>r.unregister()))))}catch(_){}try{if('caches'in window)jobs.push(caches.keys().then(ks=>Promise.all(ks.filter(k=>/^sec2026-/.test(k)).map(k=>caches.delete(k)))))}catch(_){}await Promise.allSettled(jobs)}
async function probe(){set('正在检查网页核心资源…',48);const failed=[];let done=0;await Promise.all(ASSETS.map(async p=>{try{const r=await fetch(p+'?health=20260825-r2',{cache:'no-store'});if(!r.ok)failed.push(p+' ('+r.status+')')}catch(e){failed.push(p+' (网络失败)')}finally{done++;set('正在检查网页核心资源…',48+Math.round(done/ASSETS.length*42))}}));return failed}
async function run(){retry.hidden=true;detail.textContent='';try{await clearOld();const failed=await probe();if(failed.length){set('有资源暂时无法访问',92);detail.textContent='未通过：'+failed.slice(0,5).join('、')+(failed.length>5?' 等':'');retry.hidden=false;return}set('检查通过，正在打开学习助手…',100);location.replace('./?v=20260825-r2')}catch(e){set('自动修复未完成',90);detail.textContent='请点击重新检查，或直接进入后刷新一次。';retry.hidden=false}}
retry.onclick=run;run();
})();
</script>
</body>
</html>
